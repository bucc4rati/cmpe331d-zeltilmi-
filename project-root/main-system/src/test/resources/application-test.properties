# Test Configuration
server.port=0

# Test Database Configuration (In-Memory H2 Database)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Security for testing
spring.security.user.name=test
spring.security.user.password=test

# External Service URLs (will be mocked)
flight.info.service.url=http://localhost:8081
pilot.service.url=http://localhost:8082
cabin.service.url=http://localhost:8083
passenger.service.url=http://localhost:8084

# Logging
logging.level.com.flightroster.main=INFO
logging.level.org.springframework.web=INFO

